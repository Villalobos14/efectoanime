[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-portal"
version = "0.1.0"
description = "Real-time webcam anime portal controlled by a two-hand frame gesture."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=1.1.0",
    "numpy>=1.26",
    "opencv-python>=4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
anime-portal = "anime_portal.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
